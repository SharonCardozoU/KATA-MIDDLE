@if (vista() !== 'portada') {
  <nav>
    <a routerLink="/" class="marca">Inicio</a>
    @if (vista() === 'admin') {
      <a routerLink="/admin" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Evaluaciones</a>
      <a routerLink="/admin/laboratorio" routerLinkActive="activo">Laboratorio</a>
    } @else {
      <a routerLink="/resolver" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Assessments</a>
    }
  </nav>
}
<main>
  <router-outlet />
</main>

@if (carga.visible()) {
  <div class="carga" role="status" aria-live="polite">
    <div class="carga-caja">
      <span class="spinner" aria-hidden="true"></span>
      <span>Cargando…</span>
    </div>
  </div>
}

@if (confirmacion.pedido(); as pedido) {
  <div class="carga" role="dialog" aria-modal="true">
    <div class="carga-caja dialogo">
      <strong>{{ pedido.titulo }}</strong>
      <p>{{ pedido.mensaje }}</p>
      <div class="dialogo-acciones">
        <button type="button" class="secundario" (click)="confirmacion.responder(false)">Cancelar</button>
        <button type="button" class="peligro" (click)="confirmacion.responder(true)">{{ pedido.confirmar }}</button>
      </div>
    </div>
  </div>
}
